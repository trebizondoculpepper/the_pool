name: Mission
description: A mission; its title is numbered POOL<n> on opening, its plan may live in a brief in doc/prompts/, and this issue tracks it.
title: ''
labels: [mission]
body:
  - type: input
    id: brief
    attributes:
      label: Brief
      description: Path to the brief (doc/prompts/POOL<n>-name.md for a new mission, doc/prompts/NNN-name.md for an old one), or "none yet".
    validations:
      required: true
  - type: dropdown
    id: readiness
    attributes:
      label: Readiness
      options: [ready, needs planning, needs an owner decision]
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What and why
      description: A few sentences; the reasoning stays in the brief.
    validations:
      required: true
  - type: textarea
    id: waits
    attributes:
      label: Waits on
      description: Other missions or issues this depends on, and which parts can start now.
  - type: textarea
    id: status
    attributes:
      label: Status carried over
      description: When moving a TODO.md item, paste its text and any Incomplete note.
