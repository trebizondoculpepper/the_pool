<html>
  <head>
    <style>
      @font-face {
        font-family: Antonio;
        src: url(Antonio-Variable.ttf);
        font-weight: 100 700;
      }
      html,
      body {
        margin: 0;
        background: #02213a;
      }
      #b {
        width: 728px;
        height: 90px;
        position: relative;
        overflow: hidden;
        background: #02213a;
      }
      .c {
        position: absolute;
        inset: -60px;
        background: url(the-pool-background-caustics-2560x1600.jpg) 0 0/900px
          auto;
      }
      .c2 {
        mix-blend-mode: lighten;
        opacity: 0.55;
        background-size: 1100px auto;
      }
      .g {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          #02213ae8 0%,
          #02213ab0 62%,
          #02213a70 100%
        );
      }
      .logo {
        position: absolute;
        left: 10px;
        top: 5px;
        height: 80px;
        filter: drop-shadow(0 2px 4px #0009);
      }
      h1 {
        position: absolute;
        left: 118px;
        top: 4px;
        margin: 0;
        font: 700 52px/1 Antonio;
        color: #fff;
        letter-spacing: 1px;
        -webkit-text-stroke: 3px #02213a;
        paint-order: stroke fill;
        text-shadow: 0 3px 0 #1dabcd;
      }
      p {
        position: absolute;
        left: 121px;
        top: 62px;
        margin: 0;
        font: 500 15px/1 Antonio;
        color: #f6c324;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-shadow: 0 1px 2px #000a;
      }
      .d {
        position: absolute;
        filter: drop-shadow(0 2px 4px #000a);
      }
      .btn {
        position: absolute;
        right: 16px;
        top: 25px;
        padding: 8px 16px;
        background: #f6c324;
        color: #02213a;
        font: 700 24px/1 Antonio;
        letter-spacing: 1px;
        border-radius: 4px;
        box-shadow:
          0 2px 0 #9a7a10,
          0 3px 8px #0008;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="b">
      <div class="c" id="c1"></div>
      <div class="c c2" id="c2"></div>
      <div class="g"></div>
      <img class="logo" src="the-pool-logo.svg" />
      <h1>THE POOL</h1>
      <p>Run the plant behind an impossible swimming pool</p>
      <img
        class="d"
        src="c90-2a-pump.png"
        style="left: 448px; top: 22px; height: 58px; transform: rotate(-6deg)"
      />
      <img
        class="d"
        src="c90-2b-filter.png"
        style="left: 520px; top: 4px; height: 80px; transform: rotate(5deg)"
      />
      <div class="btn" id="btn">Play free</div>
    </div>
  </body>
</html>
